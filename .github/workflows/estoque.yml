name: Estoque - gravar contagens na planilha

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: read

concurrency:
  group: estoque
  cancel-in-progress: false

jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lançar contagens pendentes na planilha de estoque
        env:
          DROPBOX_ESTOQUE_APP_KEY: ${{ secrets.DROPBOX_ESTOQUE_APP_KEY }}
          DROPBOX_ESTOQUE_REFRESH_TOKEN: ${{ secrets.DROPBOX_ESTOQUE_REFRESH_TOKEN }}
        run: python pipeline/estoque_gravar.py

name: Atualizar Surimaki Dash

on:
  schedule:
    - cron: "10 */3 * * *"   # a cada 3 horas (horário UTC)
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar DLP, extratos e PDV do Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python pipeline/sync_dropbox.py

      - name: Ler DLP, conciliar e gerar alertas
        run: python pipeline/atualizar.py

      - name: Criptografar e montar o site
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: python pipeline/publicar.py

      - name: Apagar dados em claro do servidor
        if: always()
        run: rm -rf work out

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
